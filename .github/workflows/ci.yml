name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Gepinnt, nicht `latest`. Am 2026-08-23 ist diese Pipeline ohne eine einzige
          # Codeänderung rot geworden: golangci-lint war auf v2.13.1 weitergezogen und meldete
          # SA1019 auf einer Zeile, die seit Wochen unverändert dort stand. Ein Linter, der
          # sich selbst aktualisiert, ist eine Verhaltensänderung ohne Commit — und die trifft
          # immer den, der gerade etwas anderes vorhatte.
          #
          # Das Hochziehen ist damit eine bewusste Handlung. Dependabot kann diese Zeile nicht
          # bumpen (es kennt Actions und Images, keine Versionsstrings in Eingaben), also
          # gehört sie zu dem, was man beim Aufräumen ansieht.
          version: v2.13.1
          args: --timeout=10m

  # Everything a generator owns has to be reproducible from the sources in the commit.
  #
  # The failure this prevents is specific and quiet: someone edits graph/*.graphqls, implements
  # the resolver by hand and forgets `go generate`. The build stays green because the generated
  # code still compiles — it just no longer matches the schema, and `pnpm run update-schema`
  # in tallox.gui then pulls a schema describing a server that does not exist.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: go mod tidy
      - name: generated code is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files differ from the committed ones."
            echo "Run 'go generate ./... && go mod tidy' and commit the result."
            exit 1
          fi

  # The fast path: one PostgreSQL service for the whole job, one schema per test.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tallox
          POSTGRES_PASSWORD: tallox
          POSTGRES_DB: tallox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallox -d tallox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TALLOX_TEST_DB_URL: postgres://tallox:tallox@127.0.0.1:5432/tallox_test?sslmode=disable
      # Pin the source. Without this the harness would silently fall back to Testcontainers
      # when the service is unhealthy, and this job would stop testing what it is named after.
      TALLOX_TEST_DB: env
      # Without this, a database problem would silently skip the integration tests, and
      # "green" would look exactly like "never ran".
      TALLOX_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # -shuffle=on because schema-per-test is what makes the suite order-independent, and a
      # fixed order is how that property quietly stops holding.
      - name: test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # The same integration tests, against a database created from nothing.
  #
  # Not redundant with `test`. The DevContainer's database has been migrated incrementally
  # since the day it was created, and so has production's volume — both will happily run a
  # migration that only works because of something an earlier, since-edited migration left
  # behind. A Testcontainers instance has no history at all, which is the position a new
  # production volume starts from.
  #
  # It also keeps the Testcontainers path itself alive. Nobody runs it locally (the DevContainer
  # has no Docker socket), so without this job it would rot until the day someone needs it.
  test-from-scratch:
    runs-on: ubuntu-latest
    env:
      TALLOX_TEST_DB: container
      TALLOX_TEST_DB_REQUIRED: "1"
      # The runner is thrown away after the job, so nothing needs reaping -- and Ryuk is a
      # per-session singleton that two test binaries starting at the same moment race each
      # other for. That race killed a running PostgreSQL mid-suite on 2026-08-20 (SQLSTATE
      # 57P01, "unexpected postmaster exit") and failed the reaper handshake in the run
      # before it. Locally Ryuk stays on: there the container would outlive the test process.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Only the packages that touch the database. The rest gains nothing from a container and
      # would just pay for it in wall-clock time.
      #
      # -p 1 because ./internal/store/... is two test binaries, and each of them boots its own
      # PostgreSQL (see storetest.startContainer). Run in parallel they cost twice the memory
      # for no gain and fight over the reaper; one after the other they take a container's
      # startup longer and are reliable.
      - name: integration tests on a throwaway PostgreSQL
        run: go test -count=1 -p 1 -v ./internal/store/...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A backend change can break the GUI without anything being committed in tallox.gui — a
  # renamed field, a resolver that now returns null. The end-to-end run over there builds
  # this repository as well and is the only stage that notices; without this nudge it would
  # only run on the next GUI commit, possibly weeks later.
  #
  # A feature gate, as for the release: this needs a token with write access to tallox.gui.
  # Until one exists the stage stays quiet, rather than failing on every push because of
  # missing configuration.
  notify-gui:
    needs: [lint, generate, test, test-from-scratch]
    if: ${{ github.ref == 'refs/heads/main' && vars.GUI_E2E_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: dispatch to tallox.gui
        env:
          GH_TOKEN: ${{ secrets.GUI_DISPATCH_TOKEN }}
          # Never put ${{ }} straight into `run:` — the value would be interpolated into
          # the shell line itself.
          SHA: ${{ github.sha }}
        run: |
          gh api repos/obcode/tallox.gui/dispatches \
            --method POST \
            --field event_type=backend-changed \
            --field "client_payload[sha]=${SHA}"

  release:
    needs: [lint, generate, test, test-from-scratch]
    # A feature gate, as for the deploy: set it to true once the RELEASE_TOKEN secret
    # exists. Secrets cannot be evaluated in a job-level `if`, hence a repository variable.
    # Until then the pipeline stays green rather than failing on every push because of
    # missing configuration.
    if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          changelog-generator-opt: "emojis=true"
