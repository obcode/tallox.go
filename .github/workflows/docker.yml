name: docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}

  dispatch-deploy:
    needs: build-and-push
    # A feature gate, as for the release and the deploy: without DISPATCH_TOKEN, `gh api`
    # aborts on an empty GH_TOKEN and turns the release run red. Arm it together with
    # AUTO_DEPLOY in tallox.dev once the host exists.
    if: ${{ vars.DEPLOY_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The deploy artefacts live in the private tallox.dev repository. Rather than
      # mirroring them here, the release triggers a workflow there. DISPATCH_TOKEN is a
      # fine-grained PAT with nothing but "contents: write" on obcode/tallox.dev.
      - name: Deploy in tallox.dev auslösen
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          # Through the environment, never straight into run: — the same rule ci.yml states.
          # Only a release author controls this value, but the habit is what the rule is for.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api repos/obcode/tallox.dev/dispatches \
            -f event_type=deploy-api \
            -F "client_payload[tag]=$RELEASE_TAG"
