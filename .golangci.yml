# golangci-lint v2 configuration.
#
# Pinned deliberately: relying on the tool's defaults plus `version: latest` in CI means the
# build can break because someone else released something. Explicit is cheaper.

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - wastedassign

  settings:
    gosec:
      excludes:
        # G115 flags every int -> int32/int16 conversion. Here those are sqlc parameters fed
        # from values the domain has already bounded (limits, counts, a track limit of 1..9);
        # a conversion that could overflow would be a validation bug, not a security one.
        - G115
    revive:
      rules:
        - name: exported
          # Exported identifiers want a doc comment, but not loudly enough to block work in
          # progress. Warning level, not error.
          severity: warning

  exclusions:
    generated: lax
    rules:
      # Generated code is not ours to lint.
      - path: (graph/generated/|models_gen\.go|\.sql\.go)$
        linters: [revive, gocritic, unconvert, misspell, errorlint]
      # Tests may shadow and ignore more freely — and gosec's credential, file-permission and
      # taint heuristics have nothing to find in fixtures and httptest handlers.
      - path: _test\.go$
        linters: [errcheck, gocritic, gosec]
      # The golden harness writes committed test renderings; its permissions are the repo's.
      - path: internal/golden/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/obcode/tallox.go
