# gqlgen configuration. Run `go generate ./...` after editing graph/*.graphqls.

schema:
  - graph/*.graphqls

# follow-schema for both exec and resolvers: one generated file and one resolver file per
# schema file. With a single schema this looks like ceremony; with a dozen (semester,
# module, instance, wish, token, …) it is the difference between a reviewable diff and a
# 20k-line file that every branch conflicts on.
exec:
  layout: follow-schema
  dir: graph/generated
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

# @scope is declared in the schema but never called per field. It is evaluated once per
# operation in graph/scope.go, because a scope refusal has to reject the whole operation before
# any resolver runs, and because "a mutation is a write" is a property of the operation and not
# of a field. Without skip_runtime, gqlgen would generate a DirectiveRoot entry and refuse to
# build the server until something implemented it — an implementation that would then run in
# the wrong place. The reasoning in full is in graph/directives.graphqls.
directives:
  scope:
    skip_runtime: true

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

# Hand-written types in graph/model are picked up automatically, so a type with `db:` tags
# does not need an entry here.
autobind:
  - "github.com/obcode/tallox.go/graph/model"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  # Not in graph/model: the build stamp is a property of the process, not of the domain.
  # main and /healthz use the same struct.
  BuildInfo:
    model: github.com/obcode/tallox.go/internal/buildinfo.Info
  # Bound to the policy's own type rather than generated as a second enum. The list of roles
  # exists in three places that cannot import each other — the schema, internal/policy and the
  # CHECK constraint in db/migrations — and binding removes one of the three. The remaining
  # two are compared by tests (graph and internal/store).
  Role:
    model: github.com/obcode/tallox.go/internal/policy.Role
  # Same argument as Role, and the same three homes: the schema, internal/policy and the CHECK
  # constraint in db/migrations. Binding removes one; store.TestDatabaseAndPolicyAgreeOnPhases
  # and graph.TestSchemaAndPolicyAgreeOnPhases compare the other two.
  Phase:
    model: github.com/obcode/tallox.go/internal/policy.Phase
  # Same argument as Role: the scope vocabulary exists in the schema and in internal/policy,
  # and binding removes the copy. Unlike Role there is no third home — a scope is a string in
  # a text[] column, not a CHECK constraint — because an older binary has to survive reading a
  # scope a newer one wrote. See policy.ParseScope.
  ScopeArea:
    model: github.com/obcode/tallox.go/internal/policy.ScopeArea
  ScopeVerb:
    model: github.com/obcode/tallox.go/internal/policy.ScopeVerb
  # The import vocabulary, bound for the same reason. ZpaObjectKind has the three homes Role
  # has — schema, internal/domain and the CHECK constraint — and
  # store.TestDatabaseAndDomainAgreeOnZPAKinds compares the two that remain. The other three
  # have two homes each.
  #
  # The names differ in case on purpose: the schema says Zpa because GraphQL type names read
  # as words, Go says ZPA because an initialism in a Go identifier is capitalised. Binding is
  # what lets both be idiomatic without a third copy in between.
  ZpaObjectKind:
    model: github.com/obcode/tallox.go/internal/domain.ZPAKind
  ZpaSyncTrigger:
    model: github.com/obcode/tallox.go/internal/domain.ZPASyncTrigger
  ZpaSyncStatus:
    model: github.com/obcode/tallox.go/internal/domain.ZPASyncStatus
  ZpaChangeType:
    model: github.com/obcode/tallox.go/internal/domain.ZPAChangeType
  ZpaProjectionStatus:
    model: github.com/obcode/tallox.go/internal/domain.ProjectionStatus
  ZpaProjectionFinding:
    model: github.com/obcode/tallox.go/internal/domain.ProjectionNoteCode
  # The catalogue vocabularies, bound for the same reason as Role and Phase. Frequency,
  # CourseType and InstancePartKind each have the three homes Role has — the schema,
  # internal/domain and a CHECK constraint in db/migrations — and binding removes one of them;
  # store.TestDatabaseAndDomainAgreeOnFrequencies and its two neighbours compare the rest.
  # DutyStatus has only two, because it is folded from a boolean rather than stored.
  Frequency:
    model: github.com/obcode/tallox.go/internal/domain.Frequency
  CourseType:
    model: github.com/obcode/tallox.go/internal/domain.CourseType
  InstancePartKind:
    model: github.com/obcode/tallox.go/internal/domain.InstancePartKind
  DutyStatus:
    model: github.com/obcode/tallox.go/internal/domain.DutyStatus
  ProgrammeStatus:
    model: github.com/obcode/tallox.go/internal/domain.ProgrammeStatus
  ModuleSource:
    model: github.com/obcode/tallox.go/internal/domain.ModuleSource
  ModuleKind:
    model: github.com/obcode/tallox.go/internal/domain.ModuleKind
  # A calendar day, not an instant. The type carries its own marshalling; the reasoning is in
  # graph/model/date.go and repeated for readers of the schema on the scalar itself.
  Date:
    model: github.com/obcode/tallox.go/graph/model.Date
  # Timestamps travel as RFC 3339 strings. gqlgen's Time scalar does the marshalling, so
  # nothing in the domain has to know about the wire format.
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
