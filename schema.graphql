"""
A person in the planning.

Carries identity and roles, nothing else. Teaching hours and notes about people are not
reachable here — see the `@fullReach` note in the API documentation.
"""
type Person {
  id: ID!
  """
  The address the university's login asserts. Case-insensitive, and the key we match on.
  """
  mail: String!
  name: String!
  """
  Surname first, for a list — `Nachname, Vorname`, where `name` is `Vorname Nachname`.

  Also what `name` is derived from wherever it exists: this is the spelling the examination
  office publishes without titles, and turning it round is how every name in this API comes out
  in one register.

  Taken from the list the examination office publishes, matched on the address, and `null` for
  everybody it does not know: which word of a written-out name is the surname is not something to
  guess at. A list falls back to `name` for those, which is why they are still in it.

  Only the administration reads fill this in. It is a name for a list, and nothing else needs
  one — `me` answers `null` here whoever asks.
  """
  sortName: String
  """
  Whether this account can be used at all.

  An inactive person is refused at both doors, whatever roles they hold — deactivating is the
  removal this system has, and it takes away every token in the same moment. Nobody is ever
  deleted: the assignments they held stay in the history.
  """
  active: Boolean!
  """
  The roles this person holds, in a stable order.
  """
  roles: [Role!]!
  """
  The study programmes this person's study-programme leadership applies to.

  Empty for everybody who does not lead one — and empty for a lead nobody has assigned a
  programme to yet, which is a state with consequences rather than a gap: such a lead may
  declare no demand at all. An empty list here is **not** "every programme". The role leads
  one; the role that means all of them is the dean's office.

  Readable through both doors, like `roles`: which programmes you may plan is the first thing a
  script needs to know, and on `me` it is your own data.
  """
  programmes: [Programme!]!
  """
  The study programmes this person follows as a partner faculty (`PARTNER_READER`). Empty for
  everybody else, and empty for a partner nobody has assigned one to — who then reads nothing.
  """
  partnerProgrammes: [Programme!]!
  """
  The subject groups this person's subject-group leadership applies to.

  The same shape as `programmes` one field up, and the same two readings of an empty list: empty
  for everybody who leads none, and empty for a lead nobody has assigned a group to yet — which
  is a state with consequences rather than a gap, because such a lead may fill nothing, read no
  unpublished wishes and file no modules.

  And empty, for the third time, for the dean's office: it reaches every subject group,
  including ones that do not exist yet, so there is no list to give. An empty list here is
  therefore **not** "no subject groups" on its own — it has to be read together with `roles`.

  Readable through both doors, like `roles` and `programmes`: on `me` it is your own data.
  """
  subjectGroupsLed: [SubjectGroup!]!
}
"""
A Personal Access Token, as its owner sees it.

The secret is not here and never will be: the server keeps only a checksum of it, so no query
can hand it out a second time.
"""
type PersonalAccessToken {
  """
  The public half of the token — the part between the two underscores in `tallox_…_…`.

  Safe to write down, safe to read out over the phone. It identifies the token in this list
  and in the audit log, and it is what you pass to `revokePersonalAccessToken`.
  """
  id: ID!
  """
  What you called it. Shown in the list, so that revoking the right one is not guesswork.
  """
  description: String!
  """
  The `area:verb` grants this token carries — see the `@scope` directive.

  **An empty list means unrestricted**: the token may do everything its owner's roles allow.
  Scopes only ever narrow. They are chosen when the token is created (`scopes` on
  `createPersonalAccessToken`); a token created without any carries the empty list and is
  bounded by its owner's roles alone.
  """
  scopes: [String!]!
  """
  Whether this token was minted with full reach: it reaches what you reach in a signed-in browser
  session — the planning moves marked `@fullReach`, and the unpublished rows your roles let you
  read — except token management, person and role administration and the access log. Fixed at
  creation.
  """
  fullReach: Boolean!
  createdAt: Time!
  """
  When this token stops working. There is no token without an expiry: 90 days by default, 365
  at most.
  """
  expiresAt: Time!
  """
  Roughly when the token was last used, or `null` if it never was.

  Deliberately coarse — it is only updated when the previous value is more than five minutes
  old. It answers "is this still in use, can I revoke it", which is what it is for.
  """
  lastUsedAt: Time
  """
  When it was withdrawn, or `null` while it still works.
  """
  revokedAt: Time
}
"""
Where a semester stands in the planning process.

The phase is stored and switched deliberately, never derived from the calendar. Dates slip,
and a process that moves on because a Tuesday arrived is one nobody trusts — this way the
switch is an act somebody performs, visibly and at a moment everyone can point at.

A semester moves **one step at a time**, forwards or backwards. Backwards is the correction:
reopening a plan is a normal thing for a faculty to do, and it should happen in the tool rather
than around it.
"""
enum Phase {
  """
  The programme leads declare which instances have to be offered.
  """
  DEMAND_PLANNING
  """
  Lecturers register interest. Entries are confidential until they are published — which is a separate decision, see `wishesPublishedAt`.
  """
  WISHES
  """
  The subject group leads fill the instances.
  """
  ASSIGNMENT
  """
  The programme leads go over the whole once more: the cut of the demand, who teaches what, and
  what it costs against the quota. Everything stays writable, and stays so until the semester is
  over — a colleague falling ill before the first lecture is handled here.
  """
  REVIEW
  """
  The semester is over. Its plan is the record of what was taught, and nothing is written any more.
  """
  FINAL
}
"""
One rule, and what it answers for this person.
"""
type PolicyDecision {
  """
  The rule, named as it is named in the source — so that a report can be acted on.
  """
  rule: String!
  """
  What the rule answers for this person right now.
  """
  allowed: Boolean!
  """
  Why, in a sentence somebody without the source in front of them can use.
  """
  reason: String!
}
"""
A study programme of the faculty.

Addressed by its short code — IF, IG, DA, DC — which is the name the faculty says out loud and
the examination office publishes. The same argument `Semester.code` makes: short, stable, and
belongs in a URL and in a colleague's script.
"""
type Programme {
  """
  IF, IG, DA, DC. Upper case, at most ten characters.
  """
  code: String!
  """
  The long name, maintained here rather than imported.

  The examination office publishes no long name — the field that looks like one carries the code
  again — so this is written by a person and the nightly import never touches it. Empty until
  somebody types one, and an interface should fall back to the code.
  """
  title: String!
  """
  False for a programme the examination office publishes no current regulations for.

  One such programme exists. Its modules are still planable, which is why it is here at all
  rather than treated as a data error; it simply does not belong in a picker.
  """
  active: Boolean!
  """
  Whether this faculty plans this programme — its own decision, not the examination office's.

  The catalogue holds every programme the regulations mention, and some of them this faculty
  does not plan: `NOT_OURS` is somebody else's, `DISCONTINUED` is one of ours that has run out.
  Both stay in the catalogue — their modules are still taught, and what was planned in them
  stays on record — and neither is offered in a picker or may be granted to a programme lead.

  **It cannot be derived, and that was measured.** The newest regulations of two planned
  programmes are from 2010, older than every programme on the other list; the discontinued one
  with the most active modules has more of them than three that are planned; and the programme
  object the source carries holds a code and nothing else.
  """
  planningStatus: ProgrammeStatus!
  """
  Whether the programme leads to a bachelor's or a master's, or null while nobody has recorded it.

  Recorded by the dean's office with `setProgrammeDegree`, because nothing else knows: the
  examination office delivers a code and nothing more, and the codes do not encode it. The
  nightly import never writes it. Null matches neither degree in a filter — treat it as "not
  recorded yet", not as a third kind of programme.
  """
  degree: Degree
  """
  Its versions of the examination regulations, newest first.
  """
  spos: [Spo!]!
  """
  Who leads this programme: the people holding `PROGRAMME_LEAD` for it.

  Readable by every account and through a token, like `SubjectGroup.leads` — who leads a
  programme is not confidential inside the faculty, and it is whom to ask about its demand.
  A grant that has expired is left out, and so is a partner faculty's reader, who may read the
  programme's demand but does not lead it. Empty when nobody has been given the programme yet.
  """
  leads: [Person!]!
}
"""
What a study programme may spend on teaching in one study year.

The figure comes from the faculty's capacity calculation — the teaching available to a programme,
theses included — and is entered by the dean's office. Counted the way `teachingHours` counts:
every laboratory and exercise group.

A study year is named after the year its winter semester starts in: `2026` is `2026-WS` and
`2027-SS`. Each of the two semesters is read against half of it.
"""
