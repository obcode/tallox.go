quota as far as anybody knows today. An announcement like `DemandCompletion`; it blocks nothing.
"""
type ReviewCompletion {
  """
  The semester it is about.
  """
  semester: String!
  """
  The study programme whose review is done.
  """
  programme: Programme!
  """
  When it was last said. Moves on re-announcing after a later change.
  """
  completedAt: Time!
}
"""
A role somebody holds. Everybody holds `LECTURER`; the others come on top of it.

The values are English. The interface shows the German terms the faculty uses: Dozierende,
Fachgruppenleitung, Studiengangsleitung, Dekanat.
"""
enum Role {
  """
  Teaches, keeps a profile and a competence profile, registers interest in instances.
  """
  LECTURER
  """
  Assigns the instances of one subject group.
  """
  SUBJECT_GROUP_LEAD
  """
  Declares the demand of one study programme: which instances are needed, and the catalogues.
  """
  PROGRAMME_LEAD
  """
  Reads across programmes and every unpublished wish of the faculty, switches the phases, publishes
  the wishes and the assignments, and freezes, corrects and publishes the desired teaching hours.
  """
  DEANS_OFFICE
  """
  A partner faculty following the study programmes it shares with this one. Held alone it reads
  less than an ordinary account — the demand, the controlling and the published assignments of its
  programmes, and no wishes — and writes nothing.
  """
  PARTNER_READER
  """
  Administers people, roles and tokens. Not a reader of unpublished wishes.
  """
  ADMIN
}
"""
One role grant, as stored — including one that has already expired.

Deliberately unfiltered, unlike `Person.roles`. "DEANS_OFFICE, granted on Tuesday by X,
expired on Wednesday" is the answer to the only question this record gets asked: who could see
what, and when.
"""
type RoleGrant {
  """
  The role that was granted.
  """
  role: Role!
  """
  When it was granted. Refreshed when the same grant is re-issued with a new expiry.
  """
  grantedAt: Time!
  """
  Who granted it, or `null` for a grant no human decided — the reconciliation of the
  protected administrators from the configuration file, or a future import.
  """
  grantedBy: Person
  """
  When it stops taking effect, or `null` if it does not expire.

  A grant with a date on it is how somebody steps over a threshold and has the database step
  back over it for them. The intended use is "let me look at this until this evening", not a
  way to hold a role for a semester — a grant meant to last that long should be visible as a
  permanent one rather than as a date nobody rereads.
  """
  expiresAt: Time
}
"""
The part of the API a scope refers to.

Deliberately coarse: these are meant to be ticked in a dialog by somebody whose mind is on the
evaluation script they are about to write.
"""
enum ScopeArea {
  """
  What answers without an identity. Useful for checking that a route and a credential work
  when everything else is refused: if this answers and nothing else does, the problem is the
  token and not the connection.

  **A scope list cannot take this away.** What is behind it answers without any credential, so
  a token scoped away from it would reach less than an anonymous caller — and would lose the
  one field that tells a broken credential from a broken route. Listing it is never necessary.

  Fields: `buildInfo`.
  """
  PUBLIC
  """
  Your own identity and session: who you are, which roles you hold, and which of them you are
  being judged by.

  Fields: `me`, `session`.
  """
  PROFILE
  """
  The planning process: which semesters exist, where each one stands, the faculty's subject
  groups, and — as they arrive — the demand, the assignments and the statistics.

  The first area worth narrowing a token to. `PUBLIC` and `PROFILE` are you describing
  yourself; `TOKENS` is unreachable through a token at all, and `ADMIN` partly.

  Every planning move is in this area, and the ones whose refusals answer questions about other
  people's rows are `@fullReach`: a plain token reads them, a token minted with full reach
  also makes them.

  Fields: `semesters`, `semester`, `planningSemester`, `programmes`, `programme`, `modules`,
  `module`, `teachers`,
  `courseInstances`, `courseInstance`, `teachingLoad`, `studyYearLoad`, `programmeQuotas`, `setProgrammeQuota`,
  `advanceSemesterPhase`, `setPlanningSemester`,
  `publishWishes`, `publishAssignments`,
  # setAssignment and clearAssignment are here and are @fullReach: their refusals answer
  # "is this part taken", which through a plain token the read rule would not.

  `assignments`, `myAssignments`, `assignedTeachingHours`, `setAssignment`, `clearAssignment`, `setCourseInstanceFormat`, `setCourseInstanceCiE`,
  `setModuleComponents`, `applyModuleSplitToInstances`, `setModuleProjectBased`,
  `setModuleSemesterSpan`, `createLocalModule`, `changeLocalModule`,
  `setProgrammePlanningStatus`, `setProgrammeDegree`, `declareCourseInstance`, `duplicateCourseInstance`,
  `changeCourseInstance`, `setCourseInstanceTopic`, `withdrawCourseInstance`, `addInstancePart`, `changeInstancePart`,
  `removeInstancePart`, `shareInstancePartAcrossTracks`, `splitInstancePartAcrossTracks`,

  # Dividing a part and handing it to another faculty are @fullReach like setAssignment:
  # both answer PART_ASSIGNED, which says whether somebody holds the part.

  `divideInstancePart`, `rejoinInstancePart`, `setInstancePartTaughtBy`,

  # The coverage handshake is here and is @fullReach for the same reason setAssignment is:
  # agreeing can answer `PART_ASSIGNED`, which says a part of the asking cohort is already filled.
  # With full reach that reveals nothing to somebody who may already read that programme's
  # assignments; through a plain token it would.

  `requestInstanceCoverage`, `acceptInstanceCoverage`, `releaseInstanceCoverage`,
  `copyDemandFromSemester`, `planDemand`,
  `demandCompletions`, `wishWindows`, `setDemandComplete`, `setWishWindow`,
  `reviewCompletions`, `setReviewComplete`,
  `subjectGroups`, `subjectGroup`, `mySubjectGroups`, `modulesWithoutSubjectGroup`,
  `subjectGroupsWithoutLead`, `setMySubjectGroups`, `setModulesSubjectGroup`,

  # The dean's office's three acts on the desired teaching hours, all @fullReach: there is no
  # unfreezing and no un-publishing, and a correction changes somebody else's statement. The
  # correction refuses a plain token in the domain rather than by the directive, whose null
  # would read as "taken back".

  `freezeDesiredHours`, `publishDesiredHours`, `correctDesiredTeachingHours`.
  """
  PLANNING
  """
  Registering interest in instance parts, stating which modules you can teach or would like to,
  and reading what may be read of other people's.

  Its own area rather than part of `PLANNING`, because it is the one part of the planning somebody
  might sensibly want a token narrowed *to*: "this script keeps my wishes in step with my
  calendar" is a sentence a colleague would say, and it should not carry the demand of the whole
  faculty with it. The reverse matters more — an evaluation script scoped to `PLANNING` does not
  thereby reach anybody's wishes.

  What this area does **not** do is decide what is visible. Through a plain token the wish rule
  collapses to your own entries whatever the scope says; through one minted with full reach it
  is what your roles allow in the browser. The area bounds the surface, the policy bounds the
  rows.

  Competences are here and not under `PROFILE` because "würde ich gern halten" is a wish without a
  semester, and confidential for the same reason. The desired teaching hours are here because
  they are stated on the wish screen, beside the wishes they belong to.

  Fields: `myWishes`, `wishes`, `setWish`, `withdrawWish`, `setWishTrackLimit`,
  `myCompetences`, `myCompetenceStatus`,
  `competences`, `competenceMemberStatus`, `modulesWithoutCompetence`, `setMyCompetence`,
  `withdrawMyCompetence`, `setTeacherCompetence`, `withdrawTeacherCompetence`,
  `myDesiredTeachingHours`, `desiredTeachingHours`, `desiredHoursOverview`,
  `setDesiredTeachingHours`.
  """
  WISHES
  """
  Personal Access Token management. Not reachable through a token at all — those fields are
  `@interactiveOnly`, so that a leaked token cannot mint its successors.

  Fields: `myTokens`, `createPersonalAccessToken`, `revokePersonalAccessToken`.
  """
  TOKENS
  """
  Running the installation: user and role administration, the subject groups, the module
  import, and the access log. All of it needs ADMIN (reading the import also the dean's office).

  Split by the Kind directives. Who has an account, which roles it holds, admitting teachers
  without one, and the access log are `@interactiveOnly` — granting access and reading the record
  of what tokens did stay tied to a sign-in. The subject groups and the module import are
  `@fullReach`: an administrator may run them from a token minted with full reach.

  The import is here rather than under `PLANNING` because what these fields expose is the
  operation — did the nightly job run, what did it change, run it now, what did it make of the
  untidy parts — and not the catalogue it produces. The catalogue itself is planning data and
  lives under `PLANNING`. An area of its own was considered and rejected when every field it
  could hold was unreachable through a token; it may be worth having now that the import is
  reachable with full reach, and would arrive with the scope dialog that needs it.

  Fields: `people`, `person`, `roleGrants`, `diagnoseAccess`, `teacherAccounts`,
  `createPerson`, `renamePerson`, `setPersonRoles`, `setPersonActive`, `setPersonProgrammes`,
  `setTeacherAdmitted`, `zpaSyncRuns`, `zpaSyncRun`, `zpaChanges`, `zpaCatalogueProjections`,
  `syncZpaNow`, `projectZpaCatalogue`, `accessLog`, `accessSummary`,
  `createSubjectGroup`, `renameSubjectGroup`, `setSubjectGroupActive`,
  `setSubjectGroupMembers`, `setSubjectGroupLeads`.
  """
  ADMIN
}
"""
One `area: verb` pair, when creating a token.
"""
input ScopeGrantInput {
  """
  Which part of the API. The fields belonging to each area are listed on `ScopeArea`.
  """
  area: ScopeArea!
  """
  `READ` for queries, `WRITE` for mutations — and `WRITE` includes `READ` in the same area.
  """
  verb: ScopeVerb!
}
"""
Whether a scope permits reading or changing.
"""
enum ScopeVerb {
  """
  Queries.
  """
  READ
  """
  Mutations — and queries in the same area, because a token that may change something and not look at it is not a capability anybody wants.
  """
  WRITE
}
"""
One semester, and where its planning stands.

**Nobody creates a semester.** It is a name for a stretch of time and it is there the way next
March is there — `semesters` lists the ones near now, and every code within reach can be asked
about. What gets created is a *decision* about one: switching its phase, publishing its wishes.
A semester nobody has decided anything about is in `DEMAND_PLANNING` with its wishes
confidential, which is the start of the process and needs no act to arrive at.
"""
type Semester {
  """
  The semester in the form `2026-WS` or `2026-SS`: four digits, a hyphen and the term.

  The digits are the year the term *starts* in, so the winter semester 2026/27 is `2026-WS`.
  This is the spelling the faculty already uses — the examination office writes `WS 2026`, and
  the hyphen is here because a space has to be quoted in a URL, a filename or a shell argument.

  Sorts chronologically as plain text (`2026-SS` < `2026-WS` < `2027-SS`), which is why it is
  worth having in a filename or a script rather than the id.
  """
  code: String!
  """
  Where the planning stands.
  """
  phase: Phase!
  """
  Whether this is the semester the faculty is planning right now. At most one is.

  The answer to "which semester is this page about" before anybody has chosen one — a
  preselection for every screen and a default for every script, so that neither has to guess.

  **Not derived from `phase`.** The obvious rule, "the newest one that is not `FINAL`", is
  ambiguous exactly when it matters: while the summer is being assigned, the winter is already
  in demand planning and both are open. Which of the two is meant is a decision somebody takes,
  the same way the phase is.
  """
  isPlanningSemester: Boolean!
  """
  The phases this semester can be switched to right now — one step away, in either direction.

  Computed from the same rule the mutation enforces, so an interface can render exactly the
  buttons that will work.
  """
  reachablePhases: [Phase!]!
  """
  When the wishes of this semester became visible to everybody, or `null` while they are still
  confidential.

  Separate from the phase on purpose, and not tied to it: the wish phase can end without
  publishing, so that late entries stop while the planners work, and publication can happen
  while the assignment is already running.

  There is no un-publishing. Once colleagues have seen each other's entries, clearing this
  would only be a lie about it.
  """
  wishesPublishedAt: Time
  """
  When the assignments of this semester became visible to everybody, or `null` while they are
  still confidential.

  Its own mark, independent of the one above in both directions. The ordinary case is wishes
  published while the assignment is still being made — that is what lets it be made from a
  complete picture. The reverse is unusual and legitimate: a finished plan may be published to a
  faculty whose wishes were never made public at all.

  There is no un-publishing here either.
  """
  assignmentsPublishedAt: Time
  """
  When the dean's office froze the desired teaching hours of this semester, or `null` while
  everybody may still change their own. Afterwards only the dean's office corrects a figure.

  There is no unfreezing.
  """
  desiredHoursFrozenAt: Time
  """
  When the desired teaching hours of this semester became visible to everybody, or `null`. Never
  before the freeze. The notes stay where they were.

  There is no un-publishing.
  """
  desiredHoursPublishedAt: Time
  """
  When the last decision about this semester was recorded, or `null` while none has been.

  Not "when the semester was created" — nothing creates one. It is the phase switch or the
  publication that this timestamp belongs to, and `null` means the semester is simply sitting
  in the calendar, untouched. A repeated `publishWishes` does not move it.
  """
  decidedAt: Time
}
"""
How the current request is being judged.

Read this rather than `me` when the question is "what may I do right now": it accounts for a
role narrowing, which `me` deliberately does not.
"""
type Session {
  """
  Who you are, or `null` if you are not signed in. The same value as the `me` query.
  """
  person: Person
  """
  The roles this request is actually judged by.

  Equal to `grantedRoles` unless you asked to be narrowed. This is the list an interface
  should render its navigation from.
  """
  effectiveRoles: [Role!]!
  """
  The roles you hold, whatever you are currently being judged by.

  What you get back by ending the narrowing — which is why the control that ends it must not
  itself be hidden by the narrowing.
  """
  grantedRoles: [Role!]!
  """
  Whether you asked to be judged by fewer roles than you hold.

  `true` means what you are looking at is a preview and not your own view. Say so visibly:
  somebody who forgets they are narrowed will eventually report a missing feature as a bug.
  """
  narrowed: Boolean!
  """
  Whether this is a signed-in browser session rather than a Personal Access Token.

  `false` means the `@interactiveOnly` fields will answer `null` — worth checking before
  concluding that something is empty.
  """
  interactive: Boolean!
  """
  Whether this caller reaches what a signed-in browser session reaches: `true` in the browser and
  for a token minted with `fullReach`, `false` for a plain token.

  `false` means the `@fullReach` fields will answer `null` or `FULL_REACH_REQUIRED`. The
  `@interactiveOnly` fields follow `interactive`, whatever this says.
  """
  fullReach: Boolean!
}
"""
One version of one study programme's examination regulations.

Present in this schema because a module counts *in* one, and because narrowing the catalogue to
one version is a useful question. It is deliberately **not** part of what identifies a course
instance — see `CourseInstance`.
"""
type Spo {
  id: ID!
  """
  The year, as the examination office numbers them: 2019, 2023, 2025.
  """
  version: Int!
  """
  The day this version starts applying.
  """
  validFrom: Date
  """
  The identifier the campus management system uses, for example `07-IF-2025`, or `null` while
  the version is still being entered.

  That emptiness is the only reliable signal that a version is unfinished, which matters because
  an unfinished one holds a fraction of its eventual modules and would otherwise look like a
  catalogue that lost most of them.
  """
  primussId: String
  """
  The study programme these regulations belong to.
  """
  programme: Programme!
}
"""
A subject the faculty groups modules and people by.

Three things hang off it and they are not the same thing:

* **Modules.** Exactly one group per module — "whose group fills this instance" is the sentence
  the whole assignment phase is made of, and it has to have one answer.
* **Members.** The colleagues who work in these subjects. This is **not** a permission: it decides
  what the wish screen offers first and nothing else.
* **Leads.** The colleagues who fill this group's instances — and, before publication, who read
  the wishes on them. This one *is* a grant.
"""
type SubjectGroup {
  id: ID!
  """
  The short name the faculty says out loud: `MATHE`, `SWE`, `TI`.

  What belongs in a URL and in a colleague's evaluation script, like a programme's code. Up to
  sixteen characters, so that a group split off another can carry a distinguishable suffix
  (`MATHE-ML`) instead of encoding it into the name.
  """
  code: String!
  """
  The name a person reads: `Mathematik (klassisch)`.
  """
  name: String!
  """
  False for a group that has been retired — split into two, or wound up.

  There is no delete and there will not be one. A retired group still has to render in the
  planning it was part of, and its modules keep their assignment: reassigning 506 modules is
  weeks of somebody's judgement, and a delete that took it would be silent.
  """
  active: Boolean!
  """
  The colleagues who lead this group, in the order a list reads.

  Empty is a real state, and the reason the faculty's "keine Fachgruppe ohne Person, die sich
  ihrer annimmt" is a work list here rather than a constraint: a group has to be creatable before
  its lead is decided, and a lead has to be revocable without destroying the group.

  A lead whose grant has expired is not in this list. The grant is what the scope narrows, so a
  scope outliving it would be a permission nobody granted.
  """
  leads: [Person!]!
  """
  The colleagues who work in this group's subjects.

  Readable by anybody with an account, and that is a decision rather than an oversight. The
  kickoff asks for it — "jeder in einer Fachgruppe müsste alles lesen können" — and who teaches at
  this faculty is already answerable through `teachers`. What that sentence does **not** extend to
  is unpublished wishes: those are read by the lead alone, because the first-come-first-served
  race the confidentiality rule ends plays out inside a subject group, not across them.

  Membership grants nothing. `policy.AssignmentScope` deliberately does not read it.
  """
  members: [Person!]!
  """
  How many modules are assigned to this group.

  Safe in a way a count over wishes never is: a module assignment is catalogue data, and nobody
  is protected from it being known.
  """
  moduleCount: Int!
  """
  Which modules the group holds, by name.

  Loaded only when asked for — one statement per group, and there are a handful of groups. That is
  the trade this repository makes explicitly rather than reaching for a loader: 506 modules is why
  the catalogue is batched, and ten groups is not.

  Retired modules are left out. A group is described by what it currently covers.
  """
  modules: [ModuleRef!]!
}
"""
What assigning a batch of modules did.

Reported as a number even when it is zero, because "nothing happened" and "it failed" are
indistinguishable to the person who pressed the button otherwise.
"""
type SubjectGroupAssignmentReport {
  """
  The group the modules were put into, or `null` where they were taken out of every group.
  """
  subjectGroup: SubjectGroup
  """
  How many module assignments were written or removed.
  """
  modulesAssigned: Int!
  """
  How many active modules still have no subject group at all.

  October's work list as a number: a bounded, finishable task, the same shape as "14 modules
  without a split". Retired modules are not counted — a module the examination office stopped
  publishing is not work anybody has to finish.
  """
  modulesWithoutSubjectGroup: Int!
}
"""
A subject group as it is referred to from somewhere else: enough to label it and to link to it.

Deliberately not the whole `SubjectGroup`. That one carries its leads and its members, and
filling those in for every row of a 506-module catalogue would be a statement per module. Having
a name for the reference is what stops a half-populated group being passed around as if it were a
whole one.
"""
type SubjectGroupRef {
  id: ID!
  """
  The short name the faculty says out loud: `MATHE`, `SWE`, `TI`.
  """
  code: String!
  """
  The name a person reads: `Mathematik (klassisch)`.
  """
  name: String!
  """
  False while this group is retired.

  Worth carrying rather than assuming: a module can sit in a retired group for as long as a split
  takes, and a screen that called it active would hide exactly the rows somebody is in the middle
  of moving.
  """
  active: Boolean!
}
"""
Somebody who teaches, as the examination office publishes them.

**Not a user of this installation.** Who may sign in is a separate, curated list — the people
administration — and importing this one grants nothing. The two are connected by the mail
address where both know it, which is also why a teacher the source gives no address for can
never be connected to anybody.
"""
type Teacher {
  id: ID!
  """
  The name to show: given name, surname, and no academic titles.

  Turned round from `sortName`, which is the only spelling the source publishes that is free of
  titles by construction. The written-out spelling it also publishes carries whatever titles
  somebody holds — and since an account created here carries none, showing it is how one list
  ends up in two registers, saying nothing except which table each row came from.
  """
  name: String!
  """
  Surname first, for a list. Every one of them is in this form.
  """
  sortName: String!
  """
  The address, or `null` for the handful the source gives none for.

  Also the link to a person in this installation: where somebody with this address may sign
  in, that is the same human.
  """
  mail: String
  """
  Holds a professorship.
  """
  isProfessor: Boolean!
  """
  Teaches on a contract (Lehrbeauftragte:r).
  """
  isLecturerOnContract: Boolean!
  """
  Holds an honorary professorship.
  """
  isHonoraryProfessor: Boolean!
  """
  Is staff. Not exclusive with the three above — somebody can be both.
  """
  isStaff: Boolean!
  """
  What the examination office says about the employment. Roughly four in five are true.

  Kept and shown rather than filtered on import: five of the people still named as responsible
  for a module are false here, and dropping them would leave those modules pointing at nobody
  for a reason nobody could see.
  """
  active: Boolean!
  """
  The faculty, where the source says one. Absent for more than half of them, so it is a hint
  and not a filter.
  """
  faculty: String
  """
  The last semester this person taught in, in this system's spelling — or `null` where the
  source says something that is not a semester.
  """
  lastSemester: String
  """
  Whether somebody with this address may sign in to Tallox.

  Derived from the address on every read rather than stored, so that somebody admitted this
  morning is connected to their own modules now rather than after the next import.
  """
  isUser: Boolean!
}
"""
Somebody the examination office publishes, together with the account they have here.
"""
type TeacherAccount {
  """
  The person as the examination office publishes them. Importing them granted nothing.
  """
  teacher: Teacher!
  """
  Their account here, or `null` if nobody of this address may sign in.

  An account somebody deactivated is **not** `null`: it is an account with `active: false`.
  The two look alike from outside and are not — one has never been admitted, the other has been
  admitted and had it taken away — and the next step differs accordingly.
  """
  account: Person
}
"""
The part of a programme's load spent on the modules of one home programme.
"""
type TeachingLoadShare {
  """
  The home programme of the modules.
  """
  homeProgramme: Programme!
  """
  The teaching of those modules in the programme's instances.
  """
  teachingHours: Float!
  """
  How many of the programme's instances are of those modules.
  """
  instanceCount: Int!
  """
  How many of them are elective placeholders.
  """
  fwpInstanceCount: Int!
  """
  The teaching those placeholders cost.
  """
  fwpHours: Float!
  """
  Parts among them that state no hours and therefore count zero.
  """
  partsWithoutHours: Int!
  """
  What other faculties teach in those instances, beside `teachingHours` rather than in it.
  """
  externalHours: Float!
}
"""
A moment in time, as an RFC 3339 string — for example `2026-08-01T14:30:00+02:00`.

Always in Europe/Berlin, the timezone the planning runs in.
"""
scalar Time
"""
One person's interest in one course instance.

Points at an **instance** and never at one of its parts. "One holds the lecture, another the
laboratory" is true and stays true — it is what the *assignment* decides, one step later. A wish
is somebody offering to teach a subject for a cohort, and the part-level detail they have in mind
belongs in `note` until there is somebody to agree it with.
"""
type Wish {
  id: ID!
  """
  Who registered it.

  Always the person who made the call. There is no way to register interest on somebody's behalf
  and no column that would record one: a wish entered by somebody else is not an expression of
  interest but their opinion about you, and the process has a place for that — the assignment.
  """
  person: Person!
  """
  What is wanted: one module, in one study programme, for one cohort.

  Carried whole because a wish is unreadable without it — "Analysis, IF1B" is the row somebody
  recognises, and an id is not. Its `parts` are reachable from here for a screen that wants to
  show what the instance consists of; no wish points at one of them.
  """
  instance: CourseInstance!
  """
  How much.
  """
  priority: WishPriority!
  """
  The owner's own words: „nur die Vorlesung“, „lieber Zug B“, „nur wenn es sonst niemand macht“.

  This is where the part-level detail lives during the wish phase, and deliberately as prose
  rather than as structure: „ich mache die Vorlesung, das Praktikum jemand anderes“ is a proposal
  about two people, and turning it into a field would ask one of them to decide it alone.

  Read by whoever could read the wish before publication: the owner, the leads responsible for it
  with full reach (a signed-in session or a full-reach token), the dean's office. Publication makes visible who wants what, not the
  owner's own words; for everybody else this is the empty string.
  """
  note: String!
  """
  The owner's bound on the cohorts of this module in this programme: of the cohorts they wished
  for, they take **at most this many** — „einen der beiden Züge, egal welcher“ is a wish for each
  cohort and a `trackLimit` of 1. `null` for no bound, which is also what a bound of at least the
  number of wishes means.

  The same on every wish of the group, because it belongs to the group (`setWishTrackLimit`).
  Visible wherever the wish is, like `priority`: it is part of what somebody wants, and after
  publication it is what tells colleagues that two entries are an offer of one.

  Not a count of anything: it is the owner's own statement, and reading it tells nobody how many
  others there are.
  """
  trackLimit: Int
  """
  When it was first registered. `null` where the note is empty for you: the order in which people
  registered is the first-come information the confidentiality rule exists to make irrelevant.
  """
  createdAt: Time
  """
  When it was last changed. Changing your mind moves this and keeps `createdAt`. `null` like `createdAt`.
  """
  updatedAt: Time
}
"""
How much somebody wants an instance.

Three fixed levels rather than a rank. A rank is more expressive and costs a reordering dance on
every insert in the middle, and a number nobody can read off a list without a legend. Ties are the
common case: somebody wants four things equally and would rather say so than invent an order.
"""
enum WishPriority {
  """
  Unbedingt — what somebody is actually asking for.
  """
  FIRST_CHOICE
  """
  Gerne. The default, because it is the honest answer to a form being filled in for the first time.
  """
  HAPPY_TO
  """
  Notfalls — held to fill a gap, and the level the assignment reads last.
  """
  IF_NEEDED
}
"""
One subject group's wish round, for one semester.

Only groups somebody has decided something about appear. Absent means open.
"""
type WishWindow {
  """
  The semester it is about.
  """
  semester: String!
  """
  The subject group whose wish round this is.
  """
  subjectGroup: SubjectGroupRef!
  """
  Whether entries are being taken.

  A row that says `true` is one that was shut and opened again — kept rather than deleted, so that
  the second decision is visible.
  """
  open: Boolean!
  """
  When it was last switched.
  """
  changedAt: Time!
}
"""
One rebuild of the module catalogue out of the cached payloads.
"""
type ZpaCatalogueProjection {
  id: ID!
  """
  The import run that triggered this, or `null` for a projection somebody asked for on its own.

  Both happen: every successful import projects, and the rules of the projection change often
  enough that applying a new one to data already held has to be possible.
  """
  runId: ID
  """
  When it started. Written before the first statement, so a projection that crashed is still visible.
  """
  startedAt: Time!
  """
  When it ended, or `null` while it is still going.
  """
  finishedAt: Time
  """
  How it ended.
  """
  status: ZpaProjectionStatus!
  """
  How many study programmes were written.
  """
  programmesWritten: Int!
  """
  How many teachers were written.
  """
  teachersWritten: Int!
  """
  How many modules were written.
  """
  modulesWritten: Int!
  """
  How many entries of 'this module counts in these regulations' were written.
  """
  offeringsWritten: Int!
  """
  How many such entries were removed because the source stopped supporting them.

  The only thing a projection deletes, and it is safe because nothing points at one. A module
  that disappears keeps its row and gains a retirement date instead.
  """
  offeringsRemoved: Int!
  """
  Why it failed, or `null`.
  """
  error: String
  """
  What the projection made of the parts of the source that are not tidy.
  """
  notes: [ZpaProjectionNote!]!
}
"""
One line of a run's report.

Deliberately without the payloads. They are kept in the database for the durable answer months
later, but shipping two documents per line into a list is a great many bytes for a view that
renders field names.
"""
type ZpaChange {
  id: ID!
  """
  Which kind of object.
  """
  kind: ZpaObjectKind!
  """
  The object's identifier in the examination office's database.
  """
  zpaId: String!
  """
  A human-readable name, or `null` when the payload carries none.

  For a module this is its `module` field, which is where the source keeps the name.
  """
  label: String
  """
  What happened to it.
  """
  change: ZpaChangeType!
  """
  The top-level fields whose content differs, for a change; empty otherwise.

  Field names only. This is what turns "the content differs" into something readable — "the
  hours per week and the person responsible changed" rather than two documents side by side.
  """
  changedKeys: [String!]!
  """
  When this was noticed.
  """
  detectedAt: Time!
}
"""
What happened to one object in one run.
"""
enum ZpaChangeType {
  """
  Seen for the first time.
  """
  APPEARED
  """
  Already held, and its content differs.
  """
  CHANGED
  """
  A successful fetch no longer mentions it.

  Only ever recorded after a fetch that succeeded and returned something, so that one bad night
  cannot retire a whole catalogue.
  """
  DISAPPEARED
  """
  It had disappeared and is back. The same record, with the day it was first seen intact.
  """
  REAPPEARED
}
"""
What kind of object the examination office's interface published.
"""
enum ZpaObjectKind {
  """
  A module in the catalogue, with its home programme, course type and credits.
  """
  MODULE
  """
  A catalogue slot inside one version of a programme's examination regulations — compulsory or
  elective, and possibly belonging to a specialisation.
  """
  BASKET
  """
  The association between a module, a set of examination regulations and a basket. The module
  code and the earliest programme semester live here rather than on the module, because both
  differ between the programmes a module appears in.
  """
  MSBA
  """
  One version of one programme's examination regulations.
  """
  SPO
  """
  Somebody who teaches. The list a module's responsible person is named from — and, alone
  among the five, an endpoint whose values are actually typed.

  Importing these grants nobody access: who may use this installation is a separate, curated
  list.
  """
  TEACHER
}
"""
One decision the projection made about input the examination office left untidy.

Every one of these is a decision with a reason, and none of them is a silent drop: a projection
that quietly discarded rows would be indistinguishable from a catalogue that never had them, and
the first person to notice would be a programme lead who cannot find a module they are
responsible for.
"""
enum ZpaProjectionFinding {
  """
  Skipped: the source names no home programme for the module, and every module has exactly one.
  """
  MODULE_WITHOUT_HOME_PROGRAMME
  """
  Skipped, with its modules: a programme code this system cannot store.
  """
  PROGRAMME_CODE_MALFORMED
  """
  Not projected: the association points at regulations the source no longer publishes.

  The largest of these by far, and mostly historical. There is no path from such a row to a
  programme, so it cannot become an entry in a module's list of where it counts.
  """
  ASSOCIATION_WITH_UNKNOWN_REGULATIONS
  """
  Kept, and marked inactive: a programme named only by the modules that call it home.

  Its modules stay planable, which is why it is kept at all rather than treated as an error.
  """
  PROGRAMME_WITHOUT_REGULATIONS
  """
  Kept with an empty name: the source's module record carries none, and this module appears in no
  set of regulations to borrow one from.
  """
  MODULE_WITHOUT_NAME
  """
  Kept and flagged: the examination office has retired the module.
  """
  MODULE_INACTIVE
  """
  Became `UNKNOWN`: a phrase for how often a module runs that this version does not recognise.
  """
  FREQUENCY_UNMAPPED
  """
  The same, for how the teaching is broken up.
  """
  COURSE_TYPE_UNMAPPED
  """
  Read as German: a default language of a module that this version does not recognise.
  """
  LANGUAGE_UNMAPPED
  """
  Folded with the lower value: the catalogue slots of one set of regulations disagree about the earliest semester.
  """
  MIN_SEMESTER_CONFLICT
  """
  Not stored: the source names a responsible person the teacher list does not contain.

  About one module in thirty. Either a placeholder rather than a person, or the address of
  somebody who is not in the list. The value stays in the cached payload; carrying it into the
  catalogue would put a mail address in the tables about modules.
  """
  MODULE_RESPONSIBLE_UNKNOWN
  """
  Kept: somebody who teaches and for whom the source gives no address.

  The address is the link to somebody who signs in, so such a person can never be connected to
  one — worth seeing, not worth refusing.
  """
  TEACHER_WITHOUT_MAIL
  """
  The one that is an alarm rather than a note, and it should always be absent.

  A module's entry per set of regulations is folded from up to four catalogue slots, and that
  fold is only safe because the slots never disagree about compulsory-or-elective — measured at
  zero conflicts across the whole catalogue. If this appears, the fold has been picking an
  answer.
  """
  DUTY_CONFLICT
}
"""
One line of a projection's report: what it found, how often, and a few examples.

Counts and samples rather than a row per object. The useful sentence is "665 associations across
12 sets of regulations", and whoever wants to chase one needs a handful of identifiers rather
than all of them.
"""
type ZpaProjectionNote {
  """
  What was found.
  """
  finding: ZpaProjectionFinding!
  """
  How many objects it applies to.
  """
  count: Int!
  """
  Up to twenty examples: examination office identifiers, or the phrases that were not
  recognised, or the programme codes — whichever is the useful thing to look at for this
  finding.
  """
  sample: [String!]!
}
"""
How a projection of the catalogue ended.

Three values rather than the import's four. There is no `PARTIAL`: the whole projection is one
transaction, so either the catalogue moved or it did not.
"""
enum ZpaProjectionStatus {
  """
  Still going, or the process that started it did not finish.
  """
  RUNNING
  """
  The catalogue was rebuilt.
  """
  SUCCEEDED
  """
  Nothing was written. The catalogue is exactly as it was.
  """
  FAILED
}
"""
One run of the module master data import.
"""
type ZpaSyncRun {
  id: ID!
  """
  What started it.
  """
  trigger: ZpaSyncTrigger!
  """
  The name of whoever asked for it, or `null` for the nightly job.

  A name rather than a `Person`, because that is all this answers: the question is "who set
  this off", not "tell me about them", and a link into the people graph from here would be a
  second route to person data with its own rules to get right.

  Only ever a person, never a token: asking for a run is an act with an effect outside this
  database, so it stays attributable to somebody who signed in.
  """
  startedBy: String
  """
  When it started. Written before the first fetch, so a run that crashed is still visible.
  """
  startedAt: Time!
  """
  When it ended, or `null` while it is still going.
  """
  finishedAt: Time
  """
  How it ended.
  """
  status: ZpaSyncStatus!
  """
  How many objects were fetched in total.
  """
  fetched: Int!
  """
  How many were seen for the first time, or came back after an absence.
  """
  appeared: Int!
  """
  How many already held objects had different content.
  """
  changed: Int!
  """
  How many a successful fetch stopped mentioning.
  """
  disappeared: Int!
  """
  Why it failed or was only partly applied, or `null`.
  """
  error: String
  """
  What each endpoint did.
  """
  kinds: [ZpaSyncRunKind!]!
}
"""
What one endpoint did within a run.
"""
type ZpaSyncRunKind {
  """
  Which endpoint.
  """
  kind: ZpaObjectKind!
  """
  Whether this endpoint was applied.
  """
  status: ZpaSyncStatus!
  """
  How many objects it returned.
  """
  fetched: Int!
  """
  Why it failed, in the words the operator needs, or `null`.
  """
  error: String
}
"""
How an import run ended.
"""
enum ZpaSyncStatus {
  """
  Still going, or the process that started it did not finish.
  """
  RUNNING
  """
  Every endpoint was fetched and applied.
  """
  SUCCEEDED
  """
  Some endpoints were applied and others failed.

  Not a failure: the ones that arrived are correctly up to date, and nothing belonging to an
  endpoint that failed was retired.
  """
  PARTIAL
  """
  Nothing was applied.
  """
  FAILED
}
"""
What started an import run.
"""
enum ZpaSyncTrigger {
  """
  The nightly job.
  """
  SCHEDULE
  """
  Somebody asked for it.
  """
  MANUAL
}
