  """
  Who the examination office names as responsible for this module, or `null`.

  Null for about one module in thirty, and for two different reasons that are not
  distinguished here: the source names a placeholder rather than a person, or it names an
  address that is not in the teacher list. Both appear on the import page, where the raw value
  is; it is deliberately not carried here, because a mail address belongs in the type about
  people rather than in the one about modules.
  """
  responsible: Teacher
  """
  How the teaching is broken up, as the catalogue describes it.
  """
  courseType: CourseType!
  """
  How often it runs.
  """
  frequency: Frequency!
  """
  Contact hours a **student** attends per week, as the catalogue states them.

  **Not teaching load.** The teaching held for one instance is the sum over its parts and is
  routinely larger: a four-hour module running one lecture and three laboratory groups costs the
  faculty eight hours. Summing this field is the plausible-looking wrong answer.
  """
  contactHoursPerWeek: Int
  """
  ECTS credits, as the catalogue states them.
  """
  credits: Int
  """
  False for a module the examination office has retired but still publishes.

  Distinct from a module it has stopped publishing altogether, which is `retiredAt`.
  """
  active: Boolean!
  """
  False for a module the examination office has not made official.
  """
  official: Boolean!
  """
  When a successful import stopped mentioning this module, or `null`. Modules are never deleted.
  """
  retiredAt: Time
  """
  The examination office's identifier, for cross-referencing.

  Information, never an argument. Making an imported identifier the thing external scripts key
  on is the mistake the whole import layer is arranged to avoid — undoing it later would mean
  changing somebody else's script rather than this schema.
  """
  zpaId: String
  """
  The module's page in the examination office's public module handbook, or `null`.

  `null` for a module the faculty entered itself, for one the examination office no longer
  offers — its public catalogue lists the active modules only — and on an installation with no
  connection to the examination office configured. A link to read, not an identifier: key on
  `id`.
  """
  handbookUrl: String
  """
  How the module's hours divide between teachable units — two of lecture and two of laboratory,
  say.

  **Empty means nobody has stated it yet**, and that is a normal state rather than an error: the
  examination office publishes one total and no split, so this is the faculty's own knowledge.
  While it is empty, no instance can be declared for the module (`plannable` is false);
  `proposedComponents` offers a split to confirm.
  """
  components: [ModuleComponent!]!
  """
  The sum of the components, or `null` while there are none. Compare with `contactHoursPerWeek`.
  """
  componentHours: Float
  """
  Where this module counts: one entry per version of a programme's regulations.

  The union over every programme and version, unfiltered. A module dropped from the newest
  version of one programme's regulations is still being taught to the students of the older one.
  """
  offerings: [ModuleOffering!]!
  """
  Compulsory or elective in one programme, folded over every version of its regulations, or
  `null` if the module does not appear in that programme's catalogue at all.

  `MIXED` is the honest answer where the versions disagree, which happens.
  """
  dutyStatus(
    """
    The programme's short code.
    """
    programme: String!
  ): DutyStatus
  """
  The catalogue slots this module sits in within one programme, across every version of its
  regulations, sorted. Empty if the module does not appear in that programme's catalogue.

  A union like `dutyStatus`: a basket renamed between two versions shows both names.
  """
  baskets(
    """
    The programme's short code.
    """
    programme: String!
  ): [String!]!
  """
  Whether this module appears in the named programme's catalogue.

  `false` together with a `homeProgramme` of that programme is a real and common state — the
  module is the programme's own and does not currently count in any version of its regulations.
  Twenty-six active modules are in it, which is why a programme's module list is the union of its
  catalogue and its own modules rather than the catalogue alone.
  """
  inCatalogue(
    """
    The programme's short code.
    """
    programme: String!
  ): Boolean!
  """
  How this module's hours would divide if nobody stated it — the software's own guess.

  Derived from the course type and the total on every read, and **never stored**: the laboratory
  or exercise is two hours, the unit a group is actually taught in, and the lecture takes the
  rest. That gives the lecture an even number of hours, which is what the faculty's own planning
  is made of — a six-hour module is four plus two, never three plus three.

  Empty for a module the catalogue gives no hours for. Confirming a proposal is
  `setModuleComponents` with exactly these values. Nothing is planned with it: an instance is only
  declared once the split is confirmed — see `plannable`.
  """
  proposedComponents: [ComponentProposal!]!
  """
  Whether a proposal is waiting to be confirmed.

  True while `components` is empty and a proposal exists; such a module is not `plannable` yet.
  It is the mark an interface puts on the row, and the reason it is not simply "components is
  empty": a module the catalogue states no hours for has neither, and a warning on that row would
  point at nothing to confirm.
  """
  splitIsEstimated: Boolean!
  """
  Which kind of part a number of parallel groups multiplies.

  The first unit of the split that is not the lecture: the laboratory of a lecture-plus-laboratory
  module, the exercise of a lecture-plus-exercise one, and the seminar of a module that is nothing
  else — those do run in parallel groups. `null` for a module that is only a lecture, where a
  number of groups has nothing to multiply, and for a module whose split is not confirmed yet.

  Here so that an interface offering a "how many groups" control asks the same question
  `planDemand` answers with, rather than deriving it a second time from the split.
  """
  practicalKind: InstancePartKind
  """
  Whether an instance can be declared for this module.

  True once somebody has stated the split (`components` is not empty). A proposal is **not**
  enough: the parts of an instance are made from the confirmed split only, so that a guess never
  ends up as planned teaching hours. The repair for a module that is not plannable is
  `setModuleComponents` — with `proposedComponents` where the guess is right.

  Answered here rather than worked out by each caller, because the same question is asked by the
  picker that offers a module, by the refusal that turns one away, and by the transaction that
  writes the parts.
  """
  plannable: Boolean!
  """
  The earliest programme semester a student may take this module in, in one programme — or `null`
  where its regulations do not say, which is nearly half the elective catalogue.

  Folded over every version of that programme's regulations, taking the earliest. 23 of 1076
  module/programme pairs disagree across versions, and the earliest is the one that puts the
  module where somebody looking for it expects it — the same choice a new instance's cohort year
  is seeded with.
  """
  programmeSemester(
    """
    The programme's short code.
    """
    programme: String!
  ): Int
}
"""
How one module's hours divide between teachable units.

Stated once per module by the people who know it, and stable — a new version of the regulations
does not change it. The examination office publishes one figure per module and a phrase
describing the breakdown; whether four hours are two of lecture and two of laboratory, or three
and one, exists nowhere in the source.
"""
type ModuleComponent {
  id: ID!
  """
  What kind of teaching this unit is.
  """
  kind: InstancePartKind!
  """
  Hours per week for **one** unit of this kind.

  A module with two hours of laboratory has one entry saying two, however many parallel groups
  an instance later runs — the multiplicity belongs to the instance.

  A kind may appear more than once: "lecture 2 + lecture 2" is a lecture of four that every
  instance holds **divided**, the second entry as a piece of the first (`InstancePart.dividedFrom`)
  — two people, or this faculty and another one. It is still one unit: one lecture, and for the
  practical kind one group, so a second group adds all of its hours.
  """
  teachingHours: Float!
  """
  Order within the module.
  """
  position: Int!
}
"""
One unit of a module's split, on the way in.
"""
input ModuleComponentInput {
  """
  What kind of teaching this unit is.
  """
  kind: InstancePartKind!
  """
  Hours per week for one unit of this kind. Greater than zero.
  """
  teachingHours: Float!
}
"""
Which modules to list.

An input type rather than separate arguments, unlike `people(search:, includeInactive:)`
elsewhere in this schema: six filters is past the point where positional arguments read, the set
will grow as subject groups and competences arrive, and an interface's form maps onto it field
for field.
"""
input ModuleFilter {
  """
  Relevant for this study programme, by its short code.

  Two things at once, and the second half is not redundant: the module counts in one of the
  programme's sets of regulations, **or** the programme is its home. Twenty-six active modules
  are only reachable through the second half, ten of them in the faculty's largest programme —
  and the first thing somebody does is look for a module they are responsible for.
  """
  programme: String
  """
  Narrow to one version of the regulations.

  No default, deliberately. Unfiltered, a programme's list is the union over every version it
  has: a module dropped from the newest one is still being taught to the students of the older.
  """
  spo: ID
  """
  Keep only modules with one of these frequencies.

  To find what could run in a winter semester, ask for `EVERY_WINTER_SEMESTER`,
  `EVERY_SEMESTER`, `ALTERNATING_WITHIN_SUBJECT_GROUP`, `ON_ANNOUNCEMENT` and `UNKNOWN` — the
  last three say nothing about the term and are together more than half the catalogue, so
  leaving them out hides far more than it removes.
  """
  frequency: [Frequency!]
  """
  Compulsory or elective. Requires `programme`, and is ignored without it — the answer is a
  property of a module *in a programme*, not of a module.
  """
  duty: DutyStatus
  """
  A substring of the name or of one of the module codes. Case-insensitive.
  """
  search: String
  """
  Include modules the examination office has retired. About a hundred of them.
  """
  includeInactive: Boolean = false
  """
  Only the modules this person is responsible for, by teacher id.
  """
  responsible: ID
  """
  Keep only modules whose split nobody has confirmed yet — where `splitIsEstimated` is true.

  The work list: these modules cannot be planned until somebody confirms their split. A bounded,
  finishable task rather than an open form.
  """
  withoutComponents: Boolean = false
  """
  Keep only modules that are in no subject group yet.

  The other half of the same work list, and the one October starts with: an instance can be
  declared without a subject group, but nobody can be shown their own subjects on the wish screen
  until the modules are in one.
  """
  withoutSubjectGroup: Boolean = false
  """
  Keep only the modules of one subject group, by id.
  """
  subjectGroup: ID
  """
  Keep only the modules relevant for a programme of this degree.

  The same two halves as `programme`, over every programme of the degree: at home in one, or
  counting in one of its regulations. A module that counts in a bachelor's and a master's
  matches both. A programme whose `degree` is null matches neither.
  """
  degree: Degree
}
"""
What a catalogue row stands for.
"""
enum ModuleKind {
  """
  An ordinary module.
  """
  MODULE
  """
  A placeholder for an elective nobody has chosen yet: "we need three, ideally something
  technical".

  Planned like any other module, so that the demand, the hours and later the wishes work on it
  unchanged. Colleagues register interest in one of its cohorts with a concrete subject in mind.
  """
  FWP_PLACEHOLDER
}
"""
This module counts in this version of these regulations.

One entry per module per version, folded from the catalogue slots the module sits in. Rebuilt
from the examination office's data on every import and never edited here: it is a statement
about somebody else's regulations, and an editable copy would be a second version of them that
nobody in the faculty is authorised to keep.
"""
type ModuleOffering {
  """
  The version of the regulations this module counts in.
  """
  spo: Spo!
  """
  Compulsory or elective, as the catalogue slot says.
  """
  isDuty: Boolean!
  """
  The codes this module carries in these regulations, possibly several.

  Display only, never an identifier. The code belongs to the module-regulations-slot triple
  rather than to the module: 85 module/version pairs carry more than one because the
  specialisation is inside the code, one module carries eight across the catalogue, and a fifth
  of the source rows carry none at all.
  """
  moduleCodes: [String!]!
  """
  The specialisations whose catalogue this module sits in.
  """
  focuses: [String!]!
  """
  The catalogue slots this module sits in within this version, by the examination office's name:
  "Pflichtmodule", "WPF Anwendungen des maschinellen Lernens". Display only, never an identifier.
  """
  baskets: [String!]!
  """
  The earliest programme semester a student may take it in.

  A floor, not a cohort year and not a timetable slot. Nearly half the source rows say 1, which
  for an elective means "no restriction".
  """
  minProgrammeSemester: Int
}
"""
A module as a subject group refers to it: enough to recognise, and no more.

The counterpart of `SubjectGroupRef`, and it exists for the same reason: a full `Module` carries
its split, its offerings and its regulations, and a screen asking "what is in this group" wants a
list of names.
"""
type ModuleRef {
  id: ID!
  """
  The name, which is empty for a handful of modules the examination office publishes no name for.
  """
  name: String!
  """
  The programme that plans it — IF, IG.

  Carried because a subject group reaches across programmes, so the code is what tells two
  similarly named modules apart.
  """
  homeProgrammeCode: String!
  """
  Compulsory under at least one version of some programme's regulations — the "Pflichtkatalog"
  the competence profile's minimum counts.
  """
  compulsory: Boolean!
}
"""
Where a catalogue row comes from.
"""
enum ModuleSource {
  """
  Written by the import from the examination office's catalogue.
  """
  ZPA
  """
  Entered by the faculty: a course that is not in the examination office's catalogue — or not
  yet — and the FWP placeholders.

  The import never touches such a row, and it never carries a `zpaId`.
  """
  LOCAL
}
"""
What carrying a split over did, or — after a dry run — what it would do.
"""
type ModuleSplitApplication {
  """
  True when nothing was written.
  """
  dryRun: Boolean!
  """
  Instances whose parts were rewritten, at least in part.
  """
  changed: [ModuleSplitChange!]!
  """
  What was left as it was, one entry per instance and kind.
  """
  refused: [ModuleSplitRefusal!]!
  """
  How many instances already followed the split.
  """
  unchanged: Int!
}
"""
One instance whose parts follow the split now.
"""
type ModuleSplitChange {
  """
  The instance as it is now — after a dry run, untouched.
  """
  instance: CourseInstance!
  """
  Its teaching hours before, summed over its parts.
  """
  teachingHoursBefore: Float!
  """
  And after.
  """
  teachingHoursAfter: Float!
}
"""
One kind of part in one instance that was left as it was.
"""
type ModuleSplitRefusal {
  """
  The instance the part belongs to, as it is now.
  """
  instance: CourseInstance!
  """
  The kind of part that was left as it was.
  """
  kind: InstancePartKind!
  """
  `PART_ASSIGNED`, `PART_DIVIDED` or `SPLIT_LEFT_TO_PROGRAMME`.
  """
  code: String!
  """
  The sentence to show.
  """
  message: String!
}
"""
A module of a subject group that nobody has said they can teach.
"""
type ModuleWithoutCompetence {
  id: ID!
  """
  The module's name.
  """
  name: String!
  """
  Compulsory under at least one version of some programme's regulations. These come first to mind.
  """
  compulsory: Boolean!
}
"""
Everything that changes something.

Most of it is `@fullReach`: it answers in a signed-in browser session and through a token minted
with `fullReach`, and refuses a plain token with `FULL_REACH_REQUIRED`. Token management, person and
role administration are `@interactiveOnly` and answer no token at all. Writing your own wishes,
competences and desired hours works through every token. Each field says which applies.
"""
type Mutation {
  """
  Create a Personal Access Token for yourself.

  The secret comes back once, in the response. Only in a signed-in browser session: through a
  token this fails with `INTERACTIVE_ONLY`, so that a leaked token cannot create its own
  successors.
  """
  createPersonalAccessToken(
    """
    What it is for, in your own words. Not secret — it is there so you recognise it later.
    """
    description: String!

    """
    How many days it should live. 90 if you leave this out, 365 at most, 1 at least.
    """
    expiresInDays: Int

    """
    What this token may reach. **Leave it out and the token is unrestricted** — it can do
    everything your roles allow.

    A scope only ever narrows. Listing `PLANNING: READ` gives you a token that reads the
    planning and nothing else, however much your roles would otherwise permit; it cannot give
    you anything you do not already hold.

    Which fields belong to which area is listed on `ScopeArea`. `WRITE` includes `READ` in the
    same area, so a token that reads and writes the planning needs one entry, not two.

    Fixed at creation. There is no way to change the scopes of an existing token — mint a new
    one and revoke this one, so that what the holder believes it can do and what it can do are
    never two different things.
    """
    scopes: [ScopeGrantInput!]

    """
    Mint a token with full reach: it reaches what you reach in a signed-in browser session —
    other people's unpublished wishes, assignments and competences as far as your roles allow,
    and every planning move marked `@fullReach` (declaring demand, filling parts, publishing).
    Token management, person and role administration and the access log stay browser-only.

    For planning from a script or an assistant. **At most 90 days** (`TOKEN_LIFETIME_OUT_OF_RANGE`
    otherwise), fixed at creation, and listed in the nightly access report while it is valid.
    Whatever reads the token's answers reads confidential data — an assistant included.
    """
    fullReach: Boolean! = false
  ): CreatedPersonalAccessToken! @interactiveOnly @scope(area: TOKENS, verb: WRITE)
  """
  Withdraw one of your own tokens. Immediate, and there is no way back.

  Revoking a token that is already revoked changes nothing and is not an error. A token that
  does not exist and a token belonging to somebody else produce the same refusal.
  """
  revokePersonalAccessToken(id: ID!): PersonalAccessToken! @interactiveOnly @scope(area: TOKENS, verb: WRITE)
  """
  Add somebody to this installation.

  The mail address is all that is required, and it is the only thing that has to be right: it
  is what the login asserts, so it decides whether this person can sign in at all. The name
  can be filled in later, by them or by an import. Requiring it here would mean finding out
  how a new colleague spells their first name before their account can exist.

  A new person holds no roles. Even LECTURER is granted explicitly, so that who may do what is
  a list somebody wrote rather than a default nobody chose.
  """
  createPerson(mail: String!, name: String): Person! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Set somebody's display name.
  """
  renamePerson(id: ID!, name: String!): Person! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Bring somebody's roles to exactly this set.

  The whole set rather than add and remove, because that is what the screen shows and because
  add/remove loses to a race the moment two administrators have the same person open: the
  second one's stale view of what the first did would decide the outcome.

  `expiresAt` applies to the roles being *added*. Roles already held keep their own expiry
  unless they are re-granted, so re-sending an unchanged set does not silently extend
  anything.

  Refused with `LAST_ADMIN` when it would leave the installation with nobody who can
  administer it, and with `SELF_GRANT_MUST_EXPIRE` when an administrator adds `DEANS_OFFICE`,
  `SUBJECT_GROUP_LEAD` or `PROGRAMME_LEAD` to their own set without `expiresAt`: each of those reads
  other people's unpublished wishes, and an administrator who has to look does so for a limited
  time, listed in the nightly access report.
  """
  setPersonRoles(id: ID!, roles: [Role!]!, expiresAt: Time): Person! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Activate or deactivate somebody.

  Deactivating is the removal this system has: an inactive person fails authentication on both
  doors, so it withdraws their tokens in the same moment without touching a token row.

  Refused with `LAST_ADMIN` when it would deactivate the last administrator — that is the same
  refusal as taking their ADMIN away, because it has the same consequence.
  """
  setPersonActive(id: ID!, active: Boolean!): Person! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Set which study programmes somebody's leadership applies to.

  The whole set at once, like `setPersonRoles` and for the same reason: a per-programme mutation
  would let the two halves of a swap be separated, and in between somebody leads a programme
  nobody meant them to.

  The person has to hold `PROGRAMME_LEAD` already, or this is refused with
  `NOT_A_PROGRAMME_LEAD` — grant the role first. An unknown code is refused with
  `UNKNOWN_PROGRAMME` rather than silently dropped.

  An empty list is allowed and means they lead none. That is the state a fresh grant is in, and
  it is **not** "all of them": such a lead may declare no demand until somebody assigns them a
  programme. The refusal they meet says exactly that, so nobody goes asking for a role they
  already hold.
  """
  setPersonProgrammes(id: ID!,
    """
    Short codes, for example `["IF", "IG"]`. Upper-cased and de-duplicated for you.
    """
    programmes: [String!]!

    """
    Which grant the programmes are for: `PROGRAMME_LEAD` (the default) or `PARTNER_READER`.
    Anything else is refused with `ROLE_NOT_PROGRAMME_SCOPED`; a partner without the role with
    `NOT_A_PARTNER_READER`. A partner may follow a programme the faculty does not plan.
    """
    role: Role = PROGRAMME_LEAD
  ): Person! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Let somebody from the examination office's list into this installation, or withdraw them.

  Admitting creates the account if there is none and reactivates it if there is one, and grants
  `LECTURER`. That is the one place here where a new account is not roleless, and it is what the
  act says: standing in the list of the people who teach is what that role means. It is also the
  smallest role there is — the module catalogue, and one's own profile and entries.

  Withdrawing deactivates. Nobody is ever deleted: the grants stay, so admitting somebody again
  restores what they had rather than starting them over, and their assignments stay in the
  history. It is refused with `LAST_ADMIN` when it would leave the installation with nobody who
  can administer it.

  Both directions can be repeated. Sending the state somebody is already in changes nothing,
  which is what a switch on a screen means and what a second click deserves.

  Refused with `TEACHER_HAS_NO_MAIL` for the handful the examination office gives no address
  for. The address is the whole link between the two lists, so there is nothing to admit them
  by — and nothing to invent here either.
  """
  setTeacherAdmitted(teacherId: ID!,
    """
    True admits, false withdraws.
    """
    admitted: Boolean!
  ): TeacherAccount! @interactiveOnly @scope(area: ADMIN, verb: WRITE)
  """
  Put somebody on a part of an instance.

  Pass exactly one of `personId` and `teacherId`. A teacher who holds an account is stored as the
  account.

  **`replacing` is what makes this safe when two people decide at once.** It is the id of the
  assignment you were looking at; omit it to say "I believe this part is free". A call that names
  nothing can only ever fill a part nobody holds, so somebody who has not seen the current state
  cannot take a decision away from somebody who has. Since the lead of the module's subject group
  and the lead of the instance's study programme may both write this row, that is not a formality.

  Refusals: `ASSIGNMENT_PHASE_CLOSED` once the semester is `FINAL`, `NOT_YOUR_SUBJECT` when you are
  responsible for neither the subject nor the programme, `PART_ALREADY_ASSIGNED` when you believed
  a part was free and it is not, `ASSIGNMENT_MOVED_ON` when the assignment you named is no longer
  the one there, `ASSIGNEE_INVALID` for neither or both ids, `ASSIGNEE_NOT_FOUND` for one that
  does not resolve, `PART_TAUGHT_ELSEWHERE` for a part another faculty teaches.
  """
  setAssignment(
    """
    The part to fill.
    """
    instancePartId: ID!

    """
    The account to put on it. Mutually exclusive with `teacherId`.
    """
    personId: ID

    """
    The examination office's record to put on it. Mutually exclusive with `personId`.
    """
    teacherId: ID

    """
    What to record about the decision. At most 500 characters.
    """
    note: String

    """
    The assignment being replaced, or omitted when the part is believed to be free.
    """
    replacing: ID
  ): Assignment! @fullReach @scope(area: PLANNING, verb: WRITE)
  """
  Say how a cohort is taught: across the semester or in a block, and whether in English.

  Set where the cohort is staffed, so it is bound by the assignment's rule rather than the
  demand's: the lead of the module's subject group, the lead of the instance's study programme, or
  the dean's office, while the semester is not `FINAL`.

  `taughtInEnglish: null` returns the language to the module's default in the examination
  office's catalogue. A value equal to that default is stored as `null` too, so the cohort keeps
  following the catalogue.

  Refusals: `INSTANCE_NOT_FOUND`, `NOT_YOUR_SUBJECT`, `ASSIGNMENT_PHASE_CLOSED`.
  """
  setCourseInstanceFormat(
    """
    The cohort.
    """
    id: ID!

    """
    How it is taught.
    """
    delivery: DeliveryFormat!

    """
    Whether in English, or `null` for the catalogue's default.
    """
    taughtInEnglish: Boolean
  ): CourseInstance! @fullReach @scope(area: PLANNING, verb: WRITE)
  """
  List a cohort as a course in English (CiE), or take it off the list.

  Bound by the same rule as `setCourseInstanceFormat`: the lead of the module's subject group, the
  lead of the instance's study programme, or the dean's office, while the semester is not `FINAL`.

  Refusals: `INSTANCE_NOT_FOUND`, `NOT_YOUR_SUBJECT`, `ASSIGNMENT_PHASE_CLOSED`.
  """
  setCourseInstanceCiE(
    """
    The cohort.
    """
    id: ID!

    """
    Whether it is listed as a course in English.
    """
    cie: Boolean!
  ): CourseInstance! @fullReach @scope(area: PLANNING, verb: WRITE)
  """
  Give a part back: remove an assignment.

  Bound by the same phase and the same responsibility as making one. A list that may be added to
  but not corrected is worse than a closed one.

